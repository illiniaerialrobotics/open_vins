# race1 gate positions and trajectory endpoints.
# Coordinates: FLU body frame relative to the drone boot position.
#   X = drone-boot heading (forward)
#   Y = drone-boot left
#   Z = up   (gate bottoms at Z=0, drone boot at Z=0)
# All distances in metres.

